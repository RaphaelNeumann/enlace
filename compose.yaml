name: enlace

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: enlace
      POSTGRES_USER: enlace
      POSTGRES_PASSWORD: enlace
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enlace -d enlace"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://enlace:enlace@database:5432/enlace
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    env_file:
      - path: .env.local
        required: false
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - workspace-node-modules:/workspace/node_modules
      - workspace-next:/workspace/.next
    working_dir: /workspace
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    depends_on:
      database:
        condition: service_healthy

  claude:
    build:
      context: .
      dockerfile: docker/claude.Dockerfile
    environment:
      DATABASE_URL: postgres://enlace:enlace@database:5432/enlace
    env_file:
      - path: .env.local
        required: false
    volumes:
      - .:/workspace
      - workspace-node-modules:/workspace/node_modules
      - claude-home:/home/node
      # Host Docker socket — gives Claude full control over the host's Docker
      # daemon. Effectively root on the host. Trade-off intentionally accepted
      # by the project owner; remove this line to restore the jail isolation.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      # GID of the host's docker group, so the in-container `node` user can
      # read /var/run/docker.sock without sudo. Override per-host with the env
      # var DOCKER_GID (run: `stat -c '%g' /var/run/docker.sock` on Linux,
      # `stat -f '%g' /var/run/docker.sock` on macOS). Defaults to 102 (Debian
      # bookworm host); 999 is also common (Debian/Ubuntu desktop installs).
      - "${DOCKER_GID:-102}"
    working_dir: /workspace
    stdin_open: true
    tty: true
    profiles: ["jail"]
    command: ["bash"]

volumes:
  db-data:
  workspace-node-modules:
  workspace-next:
  claude-home:
